server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' wss: ws: https: http: wss://*.peerjs.com wss://0.peerjs.com; frame-ancestors 'none'" always;

    # Health check endpoint for Coolify
    location /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'OK';
    }

    # Hub landing page at /
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Snake game — proxied to game-snake container
    location ^~ /snake/ {
        resolver 127.0.0.11 valid=10s;
        set $upstream_snake http://game-snake:80;
        proxy_pass $upstream_snake;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2048 game — proxied to game-2048 container
    location ^~ /2048/ {
        resolver 127.0.0.11 valid=10s;
        set $upstream_2048 http://game-2048:80;
        proxy_pass $upstream_2048;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Sudoku game — proxied to game-sudoku container
    location ^~ /sudoku/ {
        resolver 127.0.0.11 valid=10s;
        set $upstream_sudoku http://game-sudoku:80;
        proxy_pass $upstream_sudoku;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Redirect legacy /quiz/ URL to /mindclash/
    location ^~ /quiz/ {
        return 301 /mindclash/;
    }

    # Redirect legacy /brainsprint/ URL to /mindclash/
    location ^~ /brainsprint/ {
        return 301 /mindclash/;
    }

    # MindClash game — proxied to mindclash container
    location ^~ /mindclash/ {
        resolver 127.0.0.11 valid=2s;
        set $upstream_mindclash http://mindclash:80;
        proxy_pass $upstream_mindclash;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        proxy_next_upstream error timeout invalid_header http_502 http_503;
    }


    # Cache static assets (hub only)
    location ~* ^/assets/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
